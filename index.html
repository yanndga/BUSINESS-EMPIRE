<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1420">
<title>BUSINESS EMPIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BUSINESS EMPIRE — Feuille de style
   Identité : terminal de banque privée. Fond bleu-encre,
   accent or (richesse), menthe pour les gains, rouge pour les pertes.
   ============================================================ */
:root{
  --ink:#0E1420;            /* fond principal (bleu-encre) */
  --ink-2:#131C2B;          /* fond secondaire */
  --panel:#161F30;          /* cartes */
  --panel-2:#1D283C;        /* cartes surélevées */
  --panel-3:#243149;        /* survol / actif */
  --line:#293650;           /* bordures subtiles */
  --line-soft:#20293c;
  --gold:#E6B84C;           /* accent principal : or */
  --gold-soft:#3a2f18;
  --mint:#43D9A0;           /* gains */
  --mint-soft:#123529;
  --red:#F0736E;            /* pertes */
  --red-soft:#3a1c1e;
  --blue:#5B9CF0;           /* info */
  --violet:#9E86F0;         /* recherche */
  --txt:#EAF0F8;            /* texte principal */
  --txt-2:#9AA7BE;          /* texte secondaire */
  --txt-3:#63708a;          /* texte faible */
  --radius:16px;
  --radius-s:11px;
  --radius-xs:8px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-num:'Space Grotesk','Inter',system-ui,sans-serif;
  --nav-h:64px;
  --sidebar-w:230px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--ink);
  color:var(--txt);
  overflow:hidden;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--panel-3)}
.num{font-family:var(--font-num);font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
.pos{color:var(--mint)}
.neg{color:var(--red)}
.muted{color:var(--txt-2)}
.faint{color:var(--txt-3)}
.gold{color:var(--gold)}

/* ---------- Structure générale ---------- */
#app{display:flex;height:100%;position:relative}

/* Barre latérale (desktop) */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(180deg,var(--ink-2),var(--ink));
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;padding:22px 14px;gap:6px;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),#b98a24);
  display:grid;place-items:center;color:#1a1206;font-weight:700;font-size:19px;
  box-shadow:0 4px 14px rgba(230,184,76,.28);font-family:var(--font-num);
}
.brand-name{font-family:var(--font-num);font-weight:700;font-size:16px;letter-spacing:.3px;line-height:1}
.brand-sub{font-size:11px;color:var(--txt-3);margin-top:3px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--radius-s);
  color:var(--txt-2);font-weight:500;font-size:14.5px;transition:background .15s,color .15s;
  position:relative;
}
.nav-item .ico{font-size:18px;width:22px;text-align:center}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:var(--panel-2);color:var(--txt)}
.nav-item.active::before{content:"";position:absolute;left:0;top:20%;height:60%;width:3px;border-radius:3px;background:var(--gold)}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.sidebar-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--txt-3);line-height:1.5}

/* Zone principale */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* Barre supérieure : indicateurs clés */
.topbar{
  display:flex;align-items:center;gap:14px;padding:13px 22px;
  border-bottom:1px solid var(--line-soft);background:rgba(14,20,32,.85);
  backdrop-filter:blur(10px);flex-shrink:0;z-index:20;
}
.top-stat{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.top-stat .lbl{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.top-stat .val{font-family:var(--font-num);font-weight:600;font-size:17px;line-height:1;white-space:nowrap}
.top-cash .val{font-size:22px;color:var(--gold)}
.top-sep{width:1px;height:30px;background:var(--line);flex-shrink:0}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;background:inherit;padding-left:8px}
.lvl-chip{
  display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);
  padding:7px 13px;border-radius:30px;
}
.lvl-chip .rank{font-size:12.5px;font-weight:600}
.lvl-ring{width:26px;height:26px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;position:relative;transition:background .15s}
.icon-btn:hover{background:var(--panel-3)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red)}

/* Contenu défilant */
.content{flex:1;overflow-y:auto;padding:22px;scroll-behavior:smooth}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Grilles & cartes */
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px}
.card.pad-s{padding:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.card-title{font-size:14px;font-weight:600;letter-spacing:.2px}
.card-sub{font-size:12px;color:var(--txt-3)}
.section-title{font-family:var(--font-num);font-size:13px;font-weight:600;color:var(--txt-2);
  text-transform:uppercase;letter-spacing:1px;margin:26px 2px 12px}
.section-title:first-child{margin-top:0}

/* KPI dashboard */
.kpi-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:15px 16px;position:relative;overflow:hidden}
.kpi .k-ico{position:absolute;right:12px;top:12px;font-size:20px;opacity:.5}
.kpi .k-lbl{font-size:11.5px;color:var(--txt-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .k-val{font-family:var(--font-num);font-size:22px;font-weight:600;margin-top:8px;line-height:1.1;word-break:break-word}
.kpi .k-delta{font-size:11.5px;margin-top:5px;font-weight:500}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-s);font-weight:600;font-size:14px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#c99a2e);color:#1a1206;border-color:transparent}
.btn.gold:hover{filter:brightness(1.07)}
.btn.mint{background:var(--mint-soft);border-color:#1c5641;color:var(--mint)}
.btn.red{background:var(--red-soft);border-color:#5a2b2d;color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--panel-2);filter:none}

/* Listes d'entreprises / éléments */
.rowlist{display:flex;flex-direction:column;gap:10px}
.biz{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:15px;
  display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.biz:hover{border-color:var(--line)}
.biz-top{display:flex;align-items:center;gap:13px}
.biz-ico{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.biz-name{font-weight:600;font-size:15px}
.biz-meta{font-size:12px;color:var(--txt-3);margin-top:2px}
.biz-income{margin-left:auto;text-align:right;flex-shrink:0}
.biz-income .v{font-family:var(--font-num);font-weight:600;font-size:15px}
.biz-income .l{font-size:10.5px;color:var(--txt-3)}
.biz-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-stat{background:var(--ink-2);border-radius:var(--radius-xs);padding:8px 10px}
.mini-stat .l{font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.3px}
.mini-stat .v{font-family:var(--font-num);font-size:14px;font-weight:600;margin-top:3px}
.biz-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Barres de progression */
.bar{height:7px;background:var(--ink-2);border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:6px;background:var(--gold);transition:width .4s}
.bar.mint>span{background:var(--mint)}
.bar.blue>span{background:var(--blue)}
.bar.violet>span{background:var(--violet)}

/* Tableaux */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.4px;
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-soft)}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right}
.tbl th.num{text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.you{background:var(--gold-soft);color:var(--gold)}
.tag.agg{background:var(--red-soft);color:var(--red)}
.tag.inn{background:#1e2a4d;color:var(--blue)}
.tag.pru{background:#243149;color:var(--txt-2)}
.tag.exp{background:var(--mint-soft);color:var(--mint)}

/* Graphique (SVG) */
.chart-wrap{position:relative;width:100%}
svg.chart{width:100%;display:block;overflow:visible}
.chart-line{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart-area{opacity:.13}

/* Segments / onglets internes */
.seg{display:inline-flex;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt-2);transition:all .15s}
.seg button.active{background:var(--panel-2);color:var(--txt)}

/* Notifications feed */
.notif{display:flex;gap:11px;padding:11px 12px;border-radius:var(--radius-s);background:var(--ink-2);align-items:flex-start}
.notif .n-ico{font-size:17px;flex-shrink:0;margin-top:1px}
.notif .n-txt{font-size:13px;line-height:1.4}
.notif .n-time{font-size:10.5px;color:var(--txt-3);margin-top:3px}
.notif.clickable{cursor:pointer;transition:background .15s,border-color .15s;border:1px solid transparent}
.notif.clickable:hover{background:var(--panel-2);border-color:var(--line)}
.notif .n-go{align-self:center;font-size:22px;color:var(--gold);flex-shrink:0;font-weight:700;line-height:1}
/* Badge "possédé(s)" sur les articles de collection */
.own-badge{background:var(--gold-soft);color:var(--gold);font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-left:auto}
/* Impact net d'un employé (ROI) */
.roi{font-size:11px;font-weight:600;margin-top:2px}
.roi.pos{color:var(--mint)} .roi.neg{color:var(--red)}
/* Bandeau prestige */
.prestige-banner{background:linear-gradient(135deg,var(--gold-soft),var(--panel-2));border:1px solid var(--gold-soft);
  border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prestige-banner .pb-big{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--gold);line-height:1}
.prestige-banner .pb-lbl{font-size:11px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* Objectifs */
.obj{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-s);background:var(--ink-2)}
.obj .o-ico{width:34px;height:34px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.obj .o-body{flex:1;min-width:0}
.obj .o-title{font-size:13.5px;font-weight:600}
.obj .o-sub{font-size:11.5px;color:var(--txt-3);margin-top:2px}

/* Achievements */
.ach-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ach{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius-s);padding:13px;text-align:center;opacity:.5;transition:opacity .2s}
.ach.unlocked{opacity:1;border-color:var(--gold-soft)}
.ach .a-ico{font-size:26px;filter:grayscale(1)}
.ach.unlocked .a-ico{filter:none}
.ach .a-name{font-size:12.5px;font-weight:600;margin-top:7px}
.ach .a-desc{font-size:11px;color:var(--txt-3);margin-top:3px;line-height:1.3}

/* Toasts (notifications flottantes) */
#toasts{position:fixed;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:var(--radius-s);padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;
  animation:slideIn .3s ease}
.toast.mint{border-left-color:var(--mint)}
.toast.red{border-left-color:var(--red)}
.toast.blue{border-left-color:var(--blue)}
.toast .t-ico{font-size:18px;flex-shrink:0}
.toast .t-txt{font-size:13px;line-height:1.35}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px);height:0;margin:0;padding-top:0;padding-bottom:0}}

/* Modale */
.modal-back{position:fixed;inset:0;background:rgba(6,10,18,.72);backdrop-filter:blur(4px);z-index:900;
  display:none;align-items:center;justify-content:center;padding:18px}
.modal-back.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel);z-index:2}
.modal-h h3{font-size:17px;font-weight:600}
.modal-body{padding:20px}
.modal-close{width:32px;height:32px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;font-size:16px}

/* Grille de choix (création entreprise, régions...) */
.choice{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius-s);padding:14px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .1s}
.choice:not(.locked):hover{border-color:var(--gold-soft)}
.choice.locked{opacity:.55}
.choice-top{display:flex;align-items:center;gap:11px}
.choice-ico{width:40px;height:40px;border-radius:11px;background:var(--panel-2);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.choice-name{font-weight:600;font-size:14px}
.choice-desc{font-size:11.5px;color:var(--txt-3);line-height:1.4}
.choice-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;gap:8px}
.price-tag{font-family:var(--font-num);font-weight:600;font-size:14px;color:var(--gold)}

/* Réglage prix (slider) */
.slider-row{display:flex;align-items:center;gap:12px;margin:6px 0}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:var(--ink-2);flex:1;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--gold);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);border:3px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--gold);cursor:pointer;border:3px solid var(--panel)}

textarea{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-xs);
  color:var(--txt);padding:10px;font-family:var(--font-num);font-size:12px;resize:vertical;min-height:90px}

/* Barre de navigation inférieure (mobile) */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:rgba(19,28,43,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line-soft);
  z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav-inner{display:flex;height:var(--nav-h)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt-3);font-size:10px;font-weight:600;position:relative;transition:color .15s}
.bn-item .bn-ico{font-size:20px}
.bn-item.active{color:var(--gold)}
.bn-badge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:9px;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

/* Chargement */
#loader{position:fixed;inset:0;background:var(--ink);z-index:2000;display:grid;place-items:center}
.loader-brand{text-align:center;animation:fade .5s}
.loader-brand .lm{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;
  background:linear-gradient(135deg,var(--gold),#b98a24);display:grid;place-items:center;color:#1a1206;
  font-weight:700;font-size:30px;font-family:var(--font-num);box-shadow:0 8px 30px rgba(230,184,76,.35)}
.loader-brand h1{font-family:var(--font-num);font-size:24px;letter-spacing:2px;font-weight:700}
.loader-brand p{color:var(--txt-3);font-size:12px;margin-top:6px;letter-spacing:3px;text-transform:uppercase}

.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.gap{gap:10px}.wrap{flex-wrap:wrap}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.empty{text-align:center;padding:34px 16px;color:var(--txt-3);font-size:13.5px;line-height:1.6}
.empty .e-ico{font-size:34px;opacity:.6;margin-bottom:10px}

/* ---------- Responsive ---------- */
@media(max-width:920px){
  .two-col{grid-template-columns:1fr}
}
@media(max-width:760px){
  .sidebar{display:none}
  .bottomnav{display:block}
  .content{padding:15px 14px calc(var(--nav-h) + 20px)}
  .topbar{padding:11px 14px;gap:10px;overflow-x:auto;scrollbar-width:none}
  .topbar::-webkit-scrollbar{display:none}
  .top-cash .val{font-size:19px}
  .top-stat .val{font-size:15px}
  .topbar-right{position:sticky;right:0}
  body{font-size:14.5px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .biz-income{margin-left:auto}
}
@media(max-width:400px){
  .kpi .k-val{font-size:19px}
}
/* ---------- Multijoueur (§ ajout) ---------- */
.mp-overlay{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;
  background:rgba(6,8,12,.86);backdrop-filter:blur(6px);padding:22px}
.mp-overlay.open{display:flex}
.mp-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.mp-title{font-size:20px;font-weight:700;margin-bottom:6px}
.mp-sub{color:var(--txt-2);font-size:13.5px;margin-bottom:14px}

.mp-count.pop{animation:mpPop .55s cubic-bezier(.18,.9,.24,1.05)}

  border:2px solid var(--gold);opacity:0;z-index:1;pointer-events:none}
.mp-ring.pulse{animation:mpRing .8s ease-out}
@keyframes mpPop{0%{transform:scale(.35);opacity:0}45%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}

// nombre seul (sans devise) : "12 500" ou "1,25 Md"
function fmtNum(n){
  n = Math.round(n);
  const neg = n < 0; n = Math.abs(n);
  let s;
  if(n < 1e6){ s = n.toLocaleString("fr-FR"); }
  else if(n < 1e9){ s = trimDec(n/1e6) + " M"; }
  else if(n < 1e12){ s = trimDec(n/1e9) + " Md"; }
  else { s = trimDec(n/1e12) + " T"; }
  return (neg?"-":"") + s;
}
// montant : "540 €", "12 500 €", "1 M€", "1,25 Md€", "1 T€"
function fmtMoney(n){
  n = Math.round(n);
  const neg = n < 0; n = Math.abs(n);
  let s;
  if(n < 1e6){ s = n.toLocaleString("fr-FR") + " €"; }
  else if(n < 1e9){ s = trimDec(n/1e6) + " M€"; }
  else if(n < 1e12){ s = trimDec(n/1e9) + " Md€"; }
  else { s = trimDec(n/1e12) + " T€"; }
  return (neg?"-":"") + s;
}
function fmtMoneyShort(n){ return fmtMoney(n); }
// arrondit à 2 décimales, remplace le point par une virgule, retire les ",00"
function trimDec(x){
  let v = Math.round(x*100)/100;
  let str = (v % 1 === 0) ? v.toFixed(0) : v.toFixed(2).replace(/0$/,"").replace(/0$/,"");
  return str.replace(".", ",");
}
function fmtPct(n,dec=1){ return (Math.round(n*Math.pow(10,dec))/Math.pow(10,dec)).toString().replace(".",",") + " %"; }

  return (perSec>=0?"+":"") + fmtMoney(perSec) + "/s";

// Bonus cumulés issus de la recherche
function techBonus(){
  const b = { costMul:0, mktMul:0, demandMul:0, loanMul:0, empProdMul:0, salaryMul:0,
              rentMul:0, prestigeMul:0, sectorRev:{}, sectorCost:{} };
  G.research.done.forEach(id=>{
    const node = RESEARCH_NODES.find(n=>n.id===id); if(!node) return;
    const e = node.eff;
    if(e.costMul) b.costMul += e.costMul;
    if(e.mktMul) b.mktMul += e.mktMul;
    if(e.demandMul) b.demandMul += e.demandMul;
    if(e.loanMul) b.loanMul += e.loanMul;
    if(e.empProdMul) b.empProdMul += e.empProdMul;
    if(e.salaryMul) b.salaryMul += e.salaryMul;
    if(e.rentMul) b.rentMul += e.rentMul;
    if(e.prestigeMul) b.prestigeMul += e.prestigeMul;
    if(e.sectorRev) for(const k in e.sectorRev) b.sectorRev[k]=(b.sectorRev[k]||0)+e.sectorRev[k];
    if(e.sectorCost) for(const k in e.sectorCost) b.sectorCost[k]=(b.sectorCost[k]||0)+e.sectorCost[k];
  });
  return b;
}
// Multiplicateur de demande régionale (somme des régions débloquées)
function regionMultiplier(){
  let m = 0;
  G.regions.forEach(r=>{ if(r.unlocked){ const def=REGIONS.find(x=>x.id===r.id); m+=def.demand; }});
  return m; // France seule = 1.0
}

/* ============================================================
   ECONOMYSYSTEM — indicateurs macro (§6)
   ============================================================ */
const EconomySystem = {
  init(){
    const e = G.economy;
    e.base = {growth:e.growth, inflation:e.inflation, unemployment:e.unemployment, confidence:e.confidence, rate:e.rate};
  },
  // dérive lente chaque jour vers la base, + bruit
  tickDay(){
    const e = G.economy, b = e.base;
    e.growth       = clamp(e.growth + (b.growth-e.growth)*0.05 + rand(-0.25,0.25), -6, 8);
    e.inflation    = clamp(e.inflation + (b.inflation-e.inflation)*0.05 + rand(-0.15,0.15), 0, 15);
    e.unemployment = clamp(e.unemployment + (b.unemployment-e.unemployment)*0.05 + rand(-0.2,0.2), 2, 20);
    e.confidence   = clamp(e.confidence + (b.confidence-e.confidence)*0.05 + e.growth*0.4 + rand(-2,2), 5, 100);
    e.rate         = clamp(e.rate + (e.inflation-2)*0.02 + rand(-0.1,0.1), 0.5, 12);
  },
  // Multiplicateur de consommation global selon la conjoncture
  consumerMul(){
    const e = G.economy;
    return clamp(1 + (e.growth-2)*0.05 + (e.confidence-60)*0.004, 0.55, 1.6);
  },
  // Multiplicateur de coûts selon l'inflation
  costMul(){ return clamp(1 + (G.economy.inflation-2)*0.03, 0.8, 1.8); }
};

/* ============================================================
   EMPLOYEESYSTEM — recrutement (§9)
   ============================================================ */
const EmployeeSystem = {
  countIn(company){ return Object.values(company.employees).reduce((a,b)=>a+b,0); },
  // multiplicateur de productivité issu de la recherche RH
  prodMul(){ return 1 + techBonus().empProdMul; },
  // facteur salarial issu de la recherche RH (plancher à 40 %)
  salaryMul(){ return Math.max(0.4, 1 + techBonus().salaryMul); },
  // productivité par employé d'un type (recherche incluse)
  prodOf(type){ return EMPLOYEE_TYPES[type].prod * this.prodMul(); },
  // salaire par employé d'un type (recherche incluse)
  salaryOf(type){ return EMPLOYEE_TYPES[type].salary * this.salaryMul(); },
  // productivité totale apportée par les employés (bornée par capacité)
  // Rendements décroissants : la "puissance" brute (somme linéaire effectif × prod × bonus
  // recherche) est ramenée à une courbe qui plafonne autour de 1+EMP_SOFTCAP. Les premiers
  // employés restent très rentables ; au-delà, chaque embauche supplémentaire pèse de moins
  // en moins sur le revenu, alors que son salaire reste plein tarif — ce qui borne la stratégie
  // "j'embauche à l'infini" et remet les autres leviers (qualité, prix, marketing, recherche)
  // sur un pied d'égalité.
  rawPower(company){
    let power = 0;
    const mul = this.prodMul();
    for(const t in company.employees){
      const n = company.employees[t];
      power += n * EMPLOYEE_TYPES[t].prod * mul;
    }
    return power;
  },
  productivity(company){
    const power = this.rawPower(company);
    const cap = CompanySystem.capacity(company);
    const K = Math.max(0.01, EMP_K_FRAC * cap);
    return 1 + EMP_MAX_MULT * power / (power + K);
  },
  salaryCost(company){ // par jour
    let s = 0;
    const sm = this.salaryMul();
    for(const t in company.employees) s += company.employees[t]*EMPLOYEE_TYPES[t].salary*sm;
    return s;
  },
  // Part du bénéfice apportée par chaque employé (§ ajout).
  PROFIT_BONUS_RATE: EMP_MIN_PROFIT_SHARE, // 0,5 % du bénéfice par employé (voir plancher dans dayFinance)
  // Impact NET (par jour) d'un employé supplémentaire de ce type — pour éclairer le joueur.
  // Calculé par différence directe (avant/après une embauche simulée) plutôt que par
  // proportionnalité : avec les rendements décroissants (§EMP_SOFTCAP), le gain marginal
  // n'est plus linéaire et diminue à mesure que l'effectif grandit, jusqu'à devenir négatif
  // si le salaire dépasse la valeur ajoutée réelle de l'embauche.
  marginalNet(company, type){
    const before = CompanySystem.dayFinance(company).rev;
    company.employees[type] = (company.employees[type]||0) + 1;
    const after = CompanySystem.dayFinance(company).rev;
    company.employees[type] -= 1;
    if(company.employees[type] <= 0) delete company.employees[type];
    return (after - before) - this.salaryOf(type);
  },
  hire(company, type, n=1){
    const cap = CompanySystem.capacity(company);
    const cur = this.countIn(company);
    n = Math.min(n, cap-cur);
    if(n<=0){ UIManager.toast("Capacité maximale atteinte.","red","⚠️"); return false; }
    company.employees[type] = (company.employees[type]||0)+n;
    return true;
  },
  fire(company, type, n=1){
    if((company.employees[type]||0)<=0) return;
    company.employees[type] = Math.max(0,company.employees[type]-n);
    if(company.employees[type]===0) delete company.employees[type];
  },
  // types d'employés pertinents pour un secteur
  typesFor(sector){
    return Object.keys(EMPLOYEE_TYPES).filter(t=>{
      const s = EMPLOYEE_TYPES[t].sectors;
      return s.includes("all")||s.includes(sector);
    });
  }
};

/* ============================================================
   COMPANYSYSTEM — création, production, améliorations (§4)
   ============================================================ */
const CompanySystem = {
  // une entreprise est-elle débloquée ?
  isUnlocked(def){
    // Palier de fortune : basé sur le PIC de valeur nette atteint (maxNW), jamais sur la
    // valeur nette instantanée — sinon un emprunt (qui fait chuter la valeur nette) re-verrouillerait
    // des entreprises déjà débloquées. Les entreprises à needNW:0 (ex. Food Truck) restent
    // toujours accessibles, ce qui permet de démarrer même après avoir emprunté.
    if(def.needNW > 0){
      const peak = Math.max(G.stats.maxNW, FinanceSystem.netWorth());
      if(peak < def.needNW) return false;
    }
    if(def.needTech && !researchDone(def.needTech)) return false;
    return true;
  },
  capacity(company){
    const def = defOf(company);
    return Math.round(def.cap * (1 + (company.level-1)*0.35));
  },
  found(defId, name){
    const def = COMPANY_DEFS.find(d=>d.id===defId);
    if(!def) return false;
    const cost = def.found;
    if(G.cash < cost){ UIManager.toast("Trésorerie insuffisante.","red","⚠️"); return false; }
    G.cash -= cost;
    const c = {
      uid:uid(), defId, name:name||def.name, level:1,
      quality:rand(45,60), reputation:rand(40,55),
      priceMul:1.0, marketing:0, invested:def.found,
      employees:{}, foundedDay:G.day,
    };
    G.companies.push(c);
    NotificationSystem.push("🏢","Nouvelle entreprise : "+c.name+" fondée.","mint","biz");
    return true;
  },
  upgradeCost(company){
    const def = defOf(company);
    return Math.round(def.found * 0.6 * Math.pow(1.8, company.level));
  },
  upgrade(company){
    if(company.level >= MAX_LEVEL){ UIManager.toast("Niveau maximum atteint ("+MAX_LEVEL+").","gold","⭐"); return false; }
    const cost = this.upgradeCost(company);
    if(G.cash < cost){ UIManager.toast("Trésorerie insuffisante.","red","⚠️"); return false; }
    G.cash -= cost; company.level++;
    company.invested = (company.invested || defOf(company).found) + cost;
    company.quality = clamp(company.quality+3,0,100);
    UIManager.toast(company.name+" améliorée au niveau "+company.level+".","mint","⬆️");
    return true;
  },
  // Coût d'une campagne marketing (§16) : ajoute un boost temporaire
  investMarketing(company, amount){
    if(G.cash < amount){ UIManager.toast("Trésorerie insuffisante.","red","⚠️"); return false; }
    G.cash -= amount;
    company.invested = (company.invested || defOf(company).found) + amount;
    const eff = 1 + techBonus().mktMul;
    company.marketing = clamp(company.marketing + (amount/defOf(company).found)*40*eff, 0, 100);
    company.reputation = clamp(company.reputation + 2, 0, 100);
    UIManager.toast("Campagne marketing lancée pour "+company.name+".","blue","📣");
    return true;
  },
  // ----- Économie d'une entreprise : revenu & coût par JOUR -----
  dayFinance(company){
    const def = defOf(company);
    const tb = techBonus();
    const sector = def.sector;

    // facteurs
    const qF   = 0.5 + company.quality/100;                 // qualité (0.5 à 1.5)
    const repF = 0.6 + company.reputation/100*0.8;          // réputation
    const mktF = 1 + company.marketing/100*0.5;             // marketing
    const empF = EmployeeSystem.productivity(company);       // employés
    const share= 0.65 + MarketSystem.playerShare(sector)*1.4; // part de marché (plancher relevé pour les débutants)
    const econF= EconomySystem.consumerMul();                // conjoncture
    const secF = MarketSystem.demandFactor(sector);          // demande secteur (marché + événements)
    const priceF = this.priceFactor(company);                // effet du prix choisi
    const region = regionMultiplier() * (1 + tb.demandMul);  // régions + recherche
    const techRev = 1 + (tb.sectorRev[sector]||0);           // bonus recherche secteur
    const prestigeF = 1 + CollectionSystem.demandBonus();    // prestige de la collection

    let rev = def.rev * company.level * qF * repF * mktF * empF
              * share * econF * secF * priceF * region * techRev * prestigeF;

    // coûts
    const inflation = EconomySystem.costMul();
    const techCost = 1 + tb.costMul + (tb.sectorCost[sector]||0);
    const costFac = MarketSystem.costFactor(sector);
    const opCost = def.cost * company.level * inflation * Math.max(0.4,techCost) * costFac; // hors salaires
    const salaries = EmployeeSystem.salaryCost(company) * costFac;                          // masse salariale

    // ----- Contribution des employés (§ rééquilibré) -----
    // 'rev' inclut déjà le multiplicateur de productivité empF ; on isole le CA « sans employés »
    // pour mesurer la vraie valeur ajoutée de la masse salariale.
    const revNoEmp = rev / empF;
    const baseProfit = revNoEmp - opCost;         // bénéfice de référence (sans employés)
    let empNet = (rev - revNoEmp) - salaries;     // contribution nette « naturelle » (productivité − salaires)

    const nEmp = EmployeeSystem.countIn(company);
    if(nEmp > 0){
      // Plancher garanti : jamais une perte. Les employés rapportent au minimum une part
      // (saturante) du bénéfice de base, et au moins 0,5 % par employé. On garde la
      // productivité naturelle si elle est plus élevée.
      const pos = Math.max(0, baseProfit);
      const floor = Math.max(
        pos * EMP_FLOOR_MAX * (nEmp/(nEmp+EMP_FLOOR_K)),
        nEmp * EMP_MIN_PROFIT_SHARE * pos
      );
      empNet = Math.max(empNet, floor);
    }

    const net  = baseProfit + empNet;
    const cost = opCost + salaries;
    return { rev: net + cost, cost, net };   // CA reconstitué : CA − coûts = bénéfice voulu
  },
  // Le prix choisi : prix haut = plus de marge mais moins de clients.
  // La QUALITÉ et la RÉPUTATION déterminent la tolérance au prix : une marque premium
  // peut vendre plus cher sans perdre autant de clients. Le prix devient donc un vrai
  // levier stratégique lié aux améliorations et au marketing.
  priceFactor(company){
    const p = company.priceMul; // 0.7 .. 1.4
    const premiumTol = (company.quality/100)*0.4 + (company.reputation/100)*0.45; // 0 .. 0.85
    // Le volume chute quand le prix monte, chute atténuée par le positionnement premium.
    const volume = clamp(1 - (p-1)*(1.7 - premiumTol), 0.15, 1.8);
    return p * volume;
  },
  // Prix optimal conseillé selon le positionnement (pour l'affichage).
  optimalPrice(company){
    let best=0.7, bestF=-1;
    for(let p=0.70; p<=1.40001; p+=0.01){
      const premiumTol=(company.quality/100)*0.4+(company.reputation/100)*0.45;
      const volume=clamp(1-(p-1)*(1.7-premiumTol),0.15,1.8);
      const f=p*volume;
      if(f>bestF){ bestF=f; best=p; }
    }
    return Math.round(best*100);
  },
  perSecond(company){ return this.dayFinance(company).net / SECONDS_PER_DAY; },
  totalEmployees(){ return G.companies.reduce((a,c)=>a+EmployeeSystem.countIn(c),0); },
  // valeur d'une entreprise (pour valeur d'empire & acquisitions)
  value(company){
    // Valeur patrimoniale (pour la valeur d'empire) : capital investi + petite survaleur
    // si l'entreprise est rentable. Plafonnée pour éviter toute inflation artificielle.
    const invested = company.invested || defOf(company).found;
    const f = this.dayFinance(company);
    const premium = clamp(1 + Math.max(0, f.net) * 0.015, 1, 1.6);
    return Math.round(invested * premium);
  },
  // Prix de revente : basé sur le capital investi, TOUJOURS inférieur à celui-ci.
  // La revente sert à récupérer du capital ou à se désengager, jamais à faire un profit :
  // fonder puis revendre est donc structurellement perdant (pas d'exploit possible).
  resalePrice(company){
    const invested = company.invested || defOf(company).found;
    const f = this.dayFinance(company);
    const ratio = clamp(0.55 + Math.max(0, f.net) * 0.02, 0.55, 0.9); // 55 % à 90 % du capital
    return Math.round(invested * ratio);
  },
  // Revendre volontairement une entreprise : la retire du portefeuille et crédite la trésorerie
  sellCompany(company){
    const price = this.resalePrice(company);
    G.cash += price;
    G.companies = G.companies.filter(x=>x.uid!==company.uid);
    NotificationSystem.push("💰","Entreprise cédée : "+company.name+" pour "+fmtMoney(price)+".","mint");
    UIManager.toast(company.name+" revendue pour "+fmtMoney(price)+".","mint","💰");
    return price;
  },
  // Production stoppée si les impôts sont impayés (§ ajout) : aucune entreprise ne rapporte.
  totalPerSecond(){ if(TaxSystem.isBlocked()) return 0; return G.companies.reduce((a,c)=>a+this.perSecond(c),0); },
};
/* ============================================================
   MARKETSYSTEM — marché dynamique & parts de marché (§5, §15)
   ============================================================ */
const MarketSystem = {
  init(){
    for(const s in SECTORS){
      if(!G.market[s]){
        G.market[s] = {
          supply:rand(40,60), demand:rand(45,65), price:100,
          growth:rand(-1,3), history:[100],
          shockRev:0, shockCost:0, shockDays:0, shockSector:null
        };
      }
    }
  },
  tickDay(){
    for(const s in SECTORS){
      const m = G.market[s];
      // l'offre suit la production des concurrents + du joueur
      const playerProd = G.companies.filter(c=>sectorOf(c)===s).reduce((a,c)=>a+c.level*2,0);
      const aiProd = G.competitors.filter(c=>c.sector===s).reduce((a,c)=>a+c.production,0);
      const targetSupply = clamp(30 + playerProd + aiProd, 20, 200);
      m.supply += (targetSupply-m.supply)*0.1;
      // la demande suit la conjoncture
      const targetDemand = clamp(55 * EconomySystem.consumerMul() + m.growth*2, 20, 200);
      m.demand += (targetDemand-m.demand)*0.1 + rand(-2,2);
      // prix = f(demande/offre)
      const ratio = m.demand/Math.max(1,m.supply);
      const targetPrice = clamp(100*ratio, 30, 260);
      m.price += (targetPrice-m.price)*0.15;
      m.growth = clamp(m.growth + rand(-0.4,0.4), -4, 5);
      // décrément des chocs événementiels
      if(m.shockDays>0){ m.shockDays--; if(m.shockDays===0){ m.shockRev=0; m.shockCost=0; } }
      // historique de prix (60 points)
      m.history.push(Math.round(m.price));
      if(m.history.length>60) m.history.shift();
    }
  },
  // facteur de demande d'un secteur (prix marché normalisé + chocs)
  demandFactor(s){
    const m = G.market[s];
    return clamp(m.price/100, 0.4, 2.4) * (1 + (m.shockSector===s?m.shockRev:0));
  },
  costFactor(s){
    const m = G.market[s];
    return 1 + (m.shockSector===s?m.shockCost:0);
  },
  applyShock(sector, revShock=0, costShock=0, days=14){
    const m = G.market[sector]; if(!m) return;
    m.shockRev=revShock; m.shockCost=costShock; m.shockDays=days; m.shockSector=sector;
  },
  // "score de compétitivité" du joueur dans un secteur
  playerScore(s){
    const cs = G.companies.filter(c=>sectorOf(c)===s);
    if(!cs.length) return 0;
    return cs.reduce((a,c)=>{
      const priceAttr = clamp(1.5 - c.priceMul, 0.2, 1.3);
      return a + c.level*(0.4+c.quality/100)*(0.5+c.reputation/100)*(1+c.marketing/200)*priceAttr;
    },0);
  },
  aiScore(s){
    return G.competitors.filter(c=>c.sector===s)
      .reduce((a,c)=>a + c.strength,0);
  },
  playerShare(s){
    const ps = this.playerScore(s), as = this.aiScore(s);
    const tot = ps+as;
    return tot<=0 ? 0 : ps/tot;
  },
  isLeader(s){
    const ps = this.playerScore(s);
    if(ps<=0) return false;
    const strongest = Math.max(0, ...G.competitors.filter(c=>c.sector===s).map(c=>c.strength));
    return ps >= strongest;
  },
  // répartition détaillée (joueur + concurrents) pour l'affichage
  breakdown(s){
    const arr = [];
    const ps = this.playerScore(s);
    if(ps>0) arr.push({name:"Vous", score:ps, you:true});
    G.competitors.filter(c=>c.sector===s).forEach(c=>arr.push({name:c.name, score:c.strength, you:false}));
    const tot = arr.reduce((a,x)=>a+x.score,0)||1;
    arr.forEach(x=>x.share=x.score/tot);
    arr.sort((a,b)=>b.share-a.share);
    return arr;
  }
};

/* ============================================================
   AISYSTEM — concurrents (§8)
   ============================================================ */
const AISystem = {
  // profils boursiers par stratégie : dérive (tendance), volatilité, rendement du dividende/jour
  stockProfile(strat){
    return ({
      AGRESSIVE:{drift:0.004, vol:0.05,  div:0.0003},
      INNOVANTE:{drift:0.006, vol:0.045, div:0.0001},
      PRUDENTE: {drift:0.002, vol:0.015, div:0.0009},
      EXPANSIVE:{drift:0.004, vol:0.03,  div:0.0005},
    })[strat] || {drift:0.003, vol:0.03, div:0.0004};
  },
  init(){
    if(G.competitors.length) return;
    const secList = Object.keys(SECTORS).filter(s=>s!=="banque");
    for(let i=0;i<12;i++){
      const strat = AI_STRATEGIES[i%4];
      const sector = pick(secList);
      const price = Math.round(rand(20,420)*100)/100;
      G.competitors.push({
        id:uid(), name:AI_NAMES[i], sector, strategy:strat,
        capital:rand(50000,5000000), reputation:rand(40,80),
        production:rand(3,10), strength:rand(2,8), value:rand(200000,8000000),
        bankrupt:false,
        // ---- Bourse (§ ajout) ----
        price, priceHist:[price], held:0, avgCost:0,
        divYield:this.stockProfile(strat).div,
      });
    }
  },
  tickDay(){
    G.competitors.forEach(c=>{
      if(c.bankrupt) return;
      const s = c.strategy;
      // évolution selon la stratégie
      let growth = rand(-0.03,0.05);
      if(s==="AGRESSIVE"){ growth += 0.02; c.reputation = clamp(c.reputation-0.1,20,95); }
      if(s==="INNOVANTE"){ growth += 0.04; c.reputation = clamp(c.reputation+0.15,20,98); }
      if(s==="PRUDENTE"){ growth += 0.01; }
      if(s==="EXPANSIVE"){ growth += 0.03; c.production += rand(0,0.15); }
      // conjoncture
      growth += (EconomySystem.consumerMul()-1)*0.1;
      c.strength = clamp(c.strength*(1+growth), 0.5, 400);
      c.value = clamp(c.value*(1+growth), 50000, 5e11);
      c.capital = clamp(c.capital*(1+growth*0.5), 0, 5e11);
      c.production = clamp(c.production, 1, 60);

      // ---- Cours de bourse (§ ajout) : marche aléatoire avec tendance selon la stratégie ----
      const prof = this.stockProfile(s);
      let ret = prof.drift + rand(-prof.vol, prof.vol) + (EconomySystem.consumerMul()-1)*0.05;
      c.price = clamp((c.price||1) * (1+ret), 0.5, 5e7);
      c.price = Math.round(c.price*100)/100;
      if(!Array.isArray(c.priceHist)) c.priceHist=[c.price];
      c.priceHist.push(c.price);
      if(c.priceHist.length>40) c.priceHist.shift();

      // faillite possible pour les faibles
      if(c.strength<1 && Math.random()<0.05){
        c.bankrupt = true;
        c.price = 0;
        NotificationSystem.push("💥","Faillite : "+c.name+" fait faillite"+((c.held||0)>0?" — vos actions sont perdues.":"."),(c.held||0)>0?"red":"red","bourse");
      }
    });
  },
  acquire(comp){
    // Le rachat de concurrents a été remplacé par la Bourse (voir StockSystem). Conservé en
    // no-op pour compatibilité si un ancien élément d'interface l'appelait encore.
    return false;
  }
};

/* ============================================================
   STOCKSYSTEM — Bourse (§ ajout)
   Chaque concurrent est une action cotée. Le joueur achète/vend des actions et touche
   des dividendes quotidiens. Le cours évolue chaque jour (voir AISystem.tickDay).
   ============================================================ */
const StockSystem = {
  FEE: 0.005, // 0,5 % de frais de courtage à l'achat comme à la vente
  find(id){ return G.competitors.find(c=>c.id===id); },
  listed(){ return G.competitors.filter(c=>!c.bankrupt); },
  holdings(){ return G.competitors.filter(c=>(c.held||0)>0); },
  // valeur du portefeuille (actions détenues, hors faillite)
  portfolioValue(){ return G.competitors.reduce((a,c)=>a+((c.bankrupt?0:(c.held||0)*(c.price||0))),0); },
  // prix de revient total des positions ouvertes
  costBasis(){ return G.competitors.reduce((a,c)=>a+((c.held||0)*(c.avgCost||0)),0); },
  // plus/moins-value latente
  unrealized(){ return this.portfolioValue() - this.costBasis(); },
  // dividendes estimés par jour
  dividendsPerDay(){ return G.competitors.reduce((a,c)=>a+((c.bankrupt||!(c.held>0))?0:(c.held*c.price*(c.divYield||0))),0); },
  // variation du cours sur la dernière journée (%)
  dayChange(c){ const h=c.priceHist; if(!h||h.length<2) return 0; const p=h[h.length-2]; return p>0?((c.price-p)/p*100):0; },
  maxAffordable(c){ if(!c||c.price<=0) return 0; return Math.floor(G.cash / (c.price*(1+this.FEE))); },
  buy(id, qty){
    const c=this.find(id); if(!c||c.bankrupt){ UIManager.toast("Action indisponible.","red","⚠️"); return false; }
    qty=Math.floor(qty); if(qty<=0) return false;
    const cost = qty*c.price*(1+this.FEE);
    if(G.cash<cost){ UIManager.toast("Trésorerie insuffisante.","red","⚠️"); return false; }
    G.cash -= cost;
    const prevHeld=c.held||0, prevCost=c.avgCost||0;
    c.held = prevHeld + qty;
    c.avgCost = (prevHeld*prevCost + qty*c.price) / c.held; // prix de revient moyen pondéré
    G.stats.stocksBought = (G.stats.stocksBought||0) + qty;
    UIManager.toast("Achat : "+qty+" × "+c.name+" pour "+fmtMoney(cost)+".","mint","📈");
    return true;
  },
  sell(id, qty){
    const c=this.find(id); if(!c) return false;
    qty=Math.min(Math.floor(qty), c.held||0); if(qty<=0){ UIManager.toast("Aucune action à vendre.","blue","📉"); return false; }
    const proceeds = qty*c.price*(1-this.FEE);
    G.cash += proceeds;
    c.held -= qty;
    if(c.held<=0){ c.held=0; c.avgCost=0; }
    UIManager.toast("Vente : "+qty+" × "+c.name+" pour "+fmtMoney(proceeds)+".","gold","📉");
    return true;
  },
  // versement quotidien des dividendes
  tickDay(){
    const d = this.dividendsPerDay();
    if(d>0){
      G.cash += d;
      G.stats.dividends = (G.stats.dividends||0) + d;
    }
  },
  // migration des anciennes sauvegardes : garantit les champs boursiers sur chaque concurrent
  ensureFields(){
    if(!Array.isArray(G.competitors)) return;
    G.competitors.forEach(c=>{
      if(typeof c.price!=="number" || c.price<=0){ c.price = c.bankrupt?0:Math.round(rand(20,420)*100)/100; }
      if(!Array.isArray(c.priceHist)) c.priceHist = [c.price];
      if(typeof c.held!=="number") c.held = 0;
      if(typeof c.avgCost!=="number") c.avgCost = 0;
      if(typeof c.divYield!=="number") c.divYield = AISystem.stockProfile(c.strategy).div;
      delete c.forSale; // ancien mécanisme de rachat supprimé
    });
  }
};

/* ============================================================
   RESEARCHSYSTEM — arbre technologique (§10)
   ============================================================ */
const ResearchSystem = {
  // Retourne vrai si TOUS les prérequis d'une recherche sont terminés.
  prerequisitesMet(node){
    if(!node) return false;
    const req = Array.isArray(node.req) ? node.req : [];
    return req.every(reqId => Array.isArray(G.research.done) && G.research.done.includes(reqId));
  },

  canStart(node){
    if(!node || researchDone(node.id)) return false;
    if(G.research.active) return false;
    return this.prerequisitesMet(node);
  },

  start(node){
    if(!this.canStart(node)){
      UIManager.toast("Recherche indisponible.","red","⚠️");
      return false;
    }
    if(G.cash < node.cost){
      UIManager.toast("Trésorerie insuffisante.","red","⚠️");
      return false;
    }

    G.cash -= node.cost;
    G.research.active = {
      id: node.id,
      remaining: node.days,
      total: node.days
    };

    NotificationSystem.push(
      "🔬",
      "Recherche lancée : "+node.name+".",
      "violet",
      "research"
    );

    UIManager.refresh(true);
    return true;
  },

  complete(id){
    if(!G.research || !Array.isArray(G.research.done)) return;

    // Ne jamais enregistrer deux fois la même recherche.
    if(!G.research.done.includes(id)){
      G.research.done.push(id);
    }

    const node = RESEARCH_NODES.find(n => n.id === id);

    // IMPORTANT : libérer la recherche active avant de recalculer
    // les prérequis des autres recherches.
    G.research.active = null;

    if(node){
      NotificationSystem.push(
        "✨",
        "Recherche terminée : "+node.name+" — "+node.desc,
        "violet",
        "research"
      );
      UIManager.toast("Recherche terminée : "+node.name,"blue","✨");
    }

    // Force le recalcul complet de l'arbre technologique.
    // Les recherches dépendantes deviennent donc immédiatement lançables.
    UIManager.refresh(true);
    SaveSystem.save();
  },

  tickDay(){
    const a = G.research && G.research.active;
    if(!a) return;

    a.remaining--;

    if(a.remaining <= 0){
      this.complete(a.id);
    }
  },

  // Progression d'une recherche pendant une période hors ligne.
  advanceOffline(days){
    let completed = false;

    for(let i=0; i<days; i++){
      if(!G.research || !G.research.active) break;

      const a = G.research.active;
      a.remaining--;

      if(a.remaining <= 0){
        const id = a.id;
        this.complete(id);
        completed = true;
      }
    }

    return completed;
  }
};

const PropertySystem = {
  MAX_PER_TYPE: 200,   // plafond : 200 biens de chaque type (§ ajout)
  countOf(typeId){ return G.properties.filter(p=>p.typeId===typeId).length; },
  isFull(typeId){ return this.countOf(typeId) >= this.MAX_PER_TYPE; },
  buy(typeId){
    const t = PROPERTY_TYPES.find(p=>p.id===typeId);
    if(this.isFull(typeId)){ UIManager.toast("Limite atteinte : "+this.MAX_PER_TYPE+" "+t.name.toLowerCase()+" maximum.","red","🚫"); return false; }
    if(G.cash<t.price){ UIManager.toast("Trésorerie insuffisante.","red","⚠️"); return false; }
    G.cash -= t.price;
    G.properties.push({ uid:uid(), typeId, level:1, value:t.price, invested:t.price, boughtDay:G.day });
    NotificationSystem.push("🏠","Bien acquis : "+t.name+".","mint","immo");
    return true;
  },
  upgradeCost(p){ return Math.round(PROPERTY_TYPES.find(t=>t.id===p.typeId).price*0.4*p.level); },
  upgrade(p){
    if(p.level >= MAX_LEVEL){ UIManager.toast("Niveau maximum atteint ("+MAX_LEVEL+").","gold","⭐"); return false; }
    const cost = this.upgradeCost(p);
    if(G.cash<cost){ UIManager.toast("Trésorerie insuffisante.","red","⚠️"); return false; }
    const t = PROPERTY_TYPES.find(x=>x.id===p.typeId);
    G.cash -= cost; p.level++; p.value += cost*1.5;
    p.invested = (typeof p.invested==="number" ? p.invested : t.price) + cost; // suivi du capital investi
    UIManager.toast("Bien amélioré (niveau "+p.level+").","mint","⬆️");
    return true;
  },
  // Capital total investi dans un bien (prix + améliorations). Reconstitué pour les anciennes sauvegardes.
  investedOf(p){
    if(typeof p.invested==="number") return p.invested;
    const t = PROPERTY_TYPES.find(x=>x.id===p.typeId);
    return t.price + Math.max(0,(p.value - t.price))/1.5;
  },
  // Valeur de revente : ~−25 % du capital investi (améliorations comprises). Revendre fait perdre de l'argent.
  resaleValue(p){ return Math.round(this.investedOf(p) * 0.75); },
  sell(p){
    const v = this.resaleValue(p);
    G.cash += v;
    G.properties = G.properties.filter(x=>x.uid!==p.uid);
    UIManager.toast("Bien revendu pour "+fmtMoney(v)+" (−25 %).","gold","💰");
  },
  // Bonus de diversification : plus le patrimoine est varié, meilleur le rendement.
  diversityBonus(){
    const kinds = new Set(G.properties.map(p=>p.typeId)).size;
    return 1 + clamp(kinds*0.03, 0, 0.30); // jusqu'à +30 %
  },
  rentPerSec(p){
    const t = PROPERTY_TYPES.find(x=>x.id===p.typeId);
    const rentMul = 1 + techBonus().rentMul;        // recherche immobilière
    const div = this.diversityBonus();               // diversification
    const gross = p.value * t.yield * p.level * rentMul * div; // loyer
    const maint = gross*0.2;                         // entretien
    return (gross-maint)/SECONDS_PER_DAY;

};

/* ============================================================
   FINANCESYSTEM — trésorerie, prêts, bilan (§11, §12)
   ============================================================ */
const FinanceSystem = {
  totalDebt(){ return G.loans.reduce((a,l)=>a+l.remaining,0); },
  interestPerSec(){
    const mul = 1 + techBonus().loanMul;
    return G.loans.reduce((a,l)=>a + l.remaining*(l.rate/100)*mul,0)/360/SECONDS_PER_DAY;
  },
  maxLoan(){ return Math.max(20000, Math.round(this.assets()*0.6 - this.totalDebt())); },
  takeLoan(amount, years){
    amount = Math.round(amount);
    if(amount<=0) return false;
    if(amount>this.maxLoan()){ UIManager.toast("Montant trop élevé pour votre capacité d'emprunt.","red","⚠️"); return false; }
    const rate = clamp(G.economy.rate + 2 + this.totalDebt()/Math.max(1,this.assets())*8, 2, 22);
    G.loans.push({ id:uid(), principal:amount, remaining:amount, rate:Math.round(rate*10)/10,
                   years, monthly:Math.round(amount*(1+rate/100*years)/(years*12)) });
    G.cash += amount;
    G.stats.loansTaken++;
    NotificationSystem.push("🏦","Prêt de "+fmtMoney(amount)+" accordé à "+Math.round(rate*10)/10+" %.","blue","prets");
    return true;
  },
  repay(loan){
    if(G.cash < loan.remaining){ UIManager.toast("Trésorerie insuffisante pour solder ce prêt.","red","⚠️"); return false; }
    G.cash -= loan.remaining;
    G.loans = G.loans.filter(l=>l.id!==loan.id);
    UIManager.toast("Prêt remboursé intégralement.","mint","✅");
    return true;
  },
  // versement mensuel automatique
  monthlyPayment(){
    G.loans.forEach(l=>{
      const pay = Math.min(l.monthly, l.remaining);
      l.remaining -= pay;
      G.cash -= pay;
    });
    G.loans = G.loans.filter(l=>l.remaining>1);
  },
  companiesValue(){ return G.companies.reduce((a,c)=>a+CompanySystem.value(c),0); },
  assets(){ return G.cash + this.companiesValue() + PropertySystem.totalValue() + CollectionSystem.totalValue() + StockSystem.portfolioValue(); },
  netWorth(){ return this.assets() - this.totalDebt(); },
  // revenu net global par seconde (moteur central)
  incomePerSec(){
    return CompanySystem.totalPerSecond() + PropertySystem.totalRentPerSec() - this.interestPerSec();
  },
  // compte de résultat quotidien (pour l'écran finances)
  incomeStatement(){
    let rev=0, opCost=0;
    G.companies.forEach(c=>{ const f=CompanySystem.dayFinance(c); rev+=f.rev; opCost+=f.cost; });
    const rent = PropertySystem.totalRentPerSec()*SECONDS_PER_DAY;
    const interest = this.interestPerSec()*SECONDS_PER_DAY;
    return { rev:rev+Math.max(rent,0), opCost, interest, profit:rev+rent-opCost-interest };
  }
};

/* ============================================================
   TAXSYSTEM — fiscalité récurrente (§ ajout)
   L'État prélève 20 % du bénéfice des entreprises. L'impôt s'accumule en continu,
   devient exigible chaque mois, et doit être réglé sous TAX_GRACE_DAYS jours : passé
   l'échéance sans paiement, TOUTES les entreprises cessent de produire jusqu'au règlement.
   ============================================================ */
const TaxSystem = {
  rate(){ return (G.tax && typeof G.tax.rate==="number") ? G.tax.rate : TAX_RATE; },
  isBlocked(){ return !!(G.tax && G.tax.blocked); },
  // impôt total dû (exigible + en cours d'accumulation)
  pending(){ return G.tax.due + G.tax.accrued; },
  // jours restants avant blocage (null si rien d'exigible)
  daysLeft(){ if(!G.tax || G.tax.due<=0 || G.tax.dueDay==null) return null; return G.tax.dueDay - G.day; },
  // accumulation continue : 20 % du bénéfice courant des entreprises (0 si production stoppée)
  accrue(compNetPerSec){
    if(compNetPerSec > 0) G.tax.accrued += compNetPerSec * this.rate();
  },
  tickDay(){
    // Facturation mensuelle : le cumul de la période devient exigible.
    if(G.day>0 && G.day % DAYS_PER_MONTH === 0 && G.tax.accrued > 0.5){
      const billed = G.tax.accrued;
      G.tax.due += billed;
      G.tax.accrued = 0;
      if(G.tax.dueDay==null) G.tax.dueDay = G.day + TAX_GRACE_DAYS;
      if(G.tax.auto){ this.pay(true); }
      else {
        NotificationSystem.push("🧾","Avis d'imposition : "+fmtMoney(G.tax.due)+" à régler sous "+TAX_GRACE_DAYS+" jours.","gold","impots");
      }
    }
    // Blocage si l'échéance est dépassée sans règlement.
    if(G.tax.due>0 && G.tax.dueDay!=null && G.day >= G.tax.dueDay && !G.tax.blocked){
      G.tax.blocked = true;
      NotificationSystem.push("⛔","Impôts impayés : vos entreprises cessent de produire jusqu'au règlement.","red","impots");
      UIManager.toast("Production stoppée : impôts impayés.","red","⛔");
    }
  },
  // Règlement de l'impôt exigible.
  pay(silent=false){
    if(!G.tax || G.tax.due<=0){ if(!silent) UIManager.toast("Aucun impôt à régler.","blue","🧾"); return false; }
    if(G.cash < G.tax.due){ if(!silent) UIManager.toast("Trésorerie insuffisante pour régler l'impôt.","red","⚠️"); return false; }
    const amount = G.tax.due;
    G.cash -= amount;
    G.tax.due = 0;
    G.tax.dueDay = null;
    G.tax.totalPaid += amount;
    if(G.tax.blocked){
      G.tax.blocked = false;
      NotificationSystem.push("✅","Impôts réglés : reprise de la production.","mint","impots");
      if(!silent) UIManager.toast("Impôts réglés : production relancée.","mint","✅");
    } else if(!silent){
      UIManager.toast("Impôts réglés : "+fmtMoney(amount)+".","mint","✅");
    }
    return true;
  },
  // Acompte : règle par anticipation l'impôt en cours d'accumulation.
  payAccrued(){
    if(!G.tax || G.tax.accrued<=0){ UIManager.toast("Aucun impôt en cours d'accumulation.","blue","🧾"); return false; }
    if(G.cash < G.tax.accrued){ UIManager.toast("Trésorerie insuffisante.","red","⚠️"); return false; }
    const a = G.tax.accrued;
    G.cash -= a; G.tax.accrued = 0; G.tax.totalPaid += a;
    UIManager.toast("Acompte d'impôt versé : "+fmtMoney(a)+".","mint","✅");
    return true;
  },
  toggleAuto(){ G.tax.auto = !G.tax.auto; if(G.tax.auto) this.pay(true); }
};

/* ============================================================
   EVENTSYSTEM — événements aléatoires (§7)
   ============================================================ */
const EventSystem = {
  tickDay(){
    // décrément des événements actifs
    G.events.forEach(ev=>ev.remaining--);
    const expired = G.events.filter(ev=>ev.remaining<=0);
    expired.forEach(ev=>{
      const def = EVENTS.find(e=>e.id===ev.id);
      if(def && def.apply){ // annuler l'effet macro appliqué
        // on ré-applique l'inverse approximatif via base : la dérive s'en chargera
      }
    });
    G.events = G.events.filter(ev=>ev.remaining>0);
    // nouvel événement (probabilité par jour)
    if(Math.random()<0.06 && G.day>3){
      const def = pick(EVENTS);
      if(G.events.some(e=>e.id===def.id)) return;
      G.events.push({ id:def.id, remaining:def.days });
      if(def.apply) def.apply(G.economy);
      if(def.sector) MarketSystem.applyShock(def.sector, def.revShock||0, def.costShock||0, def.days);
      if(def.globalCost){ for(const s in SECTORS) MarketSystem.applyShock(s, 0, def.globalCost, def.days); }
      NotificationSystem.push(def.icon, def.title+" — "+def.msg, def.type, "market");
      UIManager.toast(def.title, def.type, def.icon);
    }
  }
};

/* ============================================================
   PROGRESSIONSYSTEM — niveaux, succès, objectifs (§20, §21, §33)
   ============================================================ */
const ProgressionSystem = {
  checkLevel(){
    const nw = FinanceSystem.netWorth();
    let lvl = 1;
    LEVELS.forEach(l=>{ if(nw>=l.nw) lvl=l.lvl; });
    if(lvl>G.level){
      G.level = lvl;
      const info = LEVELS.find(l=>l.lvl===lvl);
      NotificationSystem.push("🎖️","Niveau d'empire atteint : "+info.name+" !","mint");
      UIManager.toast("Nouveau statut : "+info.name,"mint","🎖️");
    }
  },
  checkAchievements(){
    ACHIEVEMENTS.forEach(a=>{
      if(!G.achievements.includes(a.id) && a.check(G)){
        G.achievements.push(a.id);
        NotificationSystem.push("🏅","Succès débloqué : "+a.name,"mint","succes");
        UIManager.toast("Succès : "+a.name,"mint","🏅");
      }
    });
  },
  // objectifs dynamiques ("encore X et je débloque Y")
  objectives(){
    const objs = [];
    const nw = FinanceSystem.netWorth();
    // prochaine entreprise débloquable
    const nextBiz = COMPANY_DEFS.find(d=>d.needNW>nw && !d.needTech);
    if(nextBiz) objs.push({ico:nextBiz.icon, title:"Débloquer : "+nextBiz.name,
      sub:"Encore "+fmtMoney(nextBiz.needNW-nw)+" de valeur nette", pct:clamp(nw/nextBiz.needNW,0,1)});
    // prochain niveau
    const nextLvl = LEVELS.find(l=>l.nw>nw);
    if(nextLvl) objs.push({ico:"🎖️", title:"Devenir "+nextLvl.name,
      sub:"Encore "+fmtMoney(nextLvl.nw-nw), pct:clamp(nw/nextLvl.nw,0,1)});
    // recherche en cours ou suivante
    if(G.research.active){ const n=RESEARCH_NODES.find(x=>x.id===G.research.active.id);
      objs.push({ico:"🔬", title:"Recherche : "+n.name, sub:"Encore "+G.research.active.remaining+" j",
        pct:1-G.research.active.remaining/G.research.active.total}); }
    else { const nr = RESEARCH_NODES.find(n=>!researchDone(n.id) && n.req.every(r=>researchDone(r)));
      if(nr) objs.push({ico:nr.icon, title:"Rechercher : "+nr.name, sub:"Coût "+fmtMoney(nr.cost), pct:clamp(G.cash/nr.cost,0,1)}); }
    return objs.slice(0,4);
  }
};

/* ============================================================
   SAVESYSTEM — sauvegarde locale & hors ligne (§23, §24)
   ============================================================ */
const SaveSystem = {
  _resetting:false,
  save(){
    if(this._resetting || !G) return;   // ne pas réécrire pendant une réinitialisation
    if(typeof MP!=="undefined" && MP.active) return; // ne pas écraser la partie solo pendant un duel
    G.lastSave = Date.now();
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }
    catch(e){ console.warn("Sauvegarde impossible", e); }
  },
  load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      G = Object.assign(GameState.new(), data);
      // garantir les sous-objets récents (compatibilité anciennes sauvegardes)
      if(!G.stats) G.stats = GameState.new().stats;
      if(!Array.isArray(G.cars)) G.cars = [];
      if(!Array.isArray(G.collectibles)) G.collectibles = [];
      if(!G.tax) G.tax = GameState.new().tax;   // compatibilité : fiscalité (§ ajout)
      StockSystem.ensureFields();                // compatibilité : bourse (§ ajout)
      MarketSystem.init(); 
      return true;
    }catch(e){ console.warn("Chargement impossible",e); return false; }
  },
  reset(){
    this._resetting = true;             // bloque autosave / beforeunload avant le rechargement
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    location.reload();
  },
  export(){ return btoa(unescape(encodeURIComponent(JSON.stringify(G)))); },
  import(str){
    try{
      const data = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
      G = Object.assign(GameState.new(), data);
      SaveSystem.save();
      location.reload();
    }catch(e){ UIManager.toast("Sauvegarde invalide.","red","⚠️"); }
  },
  // progression hors ligne
  offline(){
    if(!G.lastSave) return;
    const elapsedMs = Date.now()-G.lastSave;
    const elapsedSec = Math.floor(elapsedMs/1000);
    if(elapsedSec < 30) return;
    const capped = Math.min(elapsedSec, OFFLINE_CAP_H*3600);

    // Les recherches continuent pendant l'absence du joueur.
    // 8 secondes réelles = 1 jour de jeu.
    const offlineDays = Math.floor(capped / SECONDS_PER_DAY);
    if(offlineDays > 0 && G.research && G.research.active){
      ResearchSystem.advanceOffline(offlineDays);
    }

    const rate = FinanceSystem.incomePerSec();
    let earned = Math.max(0, rate*capped*OFFLINE_EFFICIENCY);
    // Plafond additionnel : jamais plus de 25 % de la valeur nette actuelle en un seul retour,
    // pour éviter un gain disproportionné après une très longue absence.
    const nwCap = Math.max(0, FinanceSystem.netWorth()) * 0.25;
    earned = Math.min(earned, nwCap);
    if(earned>0){
      G.cash += earned;
      G.stats.totalEarned += earned;
      UIManager.offlineModal(elapsedSec, earned);
    }
  }
};

  /* --- graphique sparkline en SVG --- */
  sparkline(values, {w=600,h=90,color="var(--gold)",fill=true}={}){
    if(!values || values.length<2) values=[0,0];
    const min=Math.min(...values), max=Math.max(...values);
    const range=(max-min)||1;
    const n=values.length;
    const pts=values.map((v,i)=>{
      const x=(i/(n-1))*w;
      const y=h-8-((v-min)/range)*(h-16);
      return [x,y];
    });
    const line=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=line+` L ${w} ${h} L 0 ${h} Z`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      ${fill?`<defs><linearGradient id="g${Math.round(Math.random()*99999)}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>`:""}
      ${fill?`<path class="chart-area" d="${area}" fill="${color}" opacity=".12"/>`:""}

  /* ---------------- IMPÔTS (§ ajout) ---------------- */
  viewTax(){
    const t = G.tax;
    const rate = TaxSystem.rate();
    const st = FinanceSystem.incomeStatement();
    // provision estimée par jour = 20 % du bénéfice quotidien positif
    const dailyTax = Math.max(0, st.profit) * rate;
    const left = TaxSystem.daysLeft();

    // --- Bandeau d'état ---
    let bannerBg, bannerBd, bannerIco, bannerTitle, bannerMsg;
    if(t.blocked){
      bannerBg="var(--red-soft)"; bannerBd="var(--red)"; bannerIco="⛔";
      bannerTitle="Production stoppée";
      bannerMsg="Vos entreprises ne produisent plus. Réglez l'impôt exigible pour relancer immédiatement l'activité.";
    } else if(t.due>0){
      bannerBg="var(--gold-soft)"; bannerBd="var(--gold)"; bannerIco="🧾";
      bannerTitle="Impôt exigible : "+fmtMoney(t.due);
      bannerMsg=(left!=null && left>=0)
        ? "À régler sous "+left+" jour"+(left>1?"s":"")+", sans quoi la production sera stoppée."
        : "Échéance dépassée — la production va être stoppée.";
    } else {
      bannerBg="var(--mint-soft)"; bannerBd="var(--mint)"; bannerIco="✅";
      bannerTitle="Situation fiscale à jour";
      bannerMsg="Aucun impôt exigible. L'impôt du mois s'accumule et deviendra exigible en fin de mois.";
    }

    let html=`<div class="card mb" style="background:${bannerBg};border-color:${bannerBd}">
      <div class="flex gap" style="align-items:flex-start">
        <div style="font-size:26px;line-height:1">${bannerIco}</div>
        <div><div class="card-title" style="margin-bottom:2px">${bannerTitle}</div>
        <div class="card-sub">${bannerMsg}</div></div>
      </div></div>`;

    // --- Indicateurs ---
    html+=`<div class="grid kpi-grid mb">
      <div class="kpi"><div class="k-lbl">Taux d'imposition</div><div class="k-val" style="font-size:19px">${fmtPct(rate*100,0)}</div></div>
      <div class="kpi"><div class="k-lbl">Impôt du mois (en cours)</div><div class="k-val" style="font-size:19px">${fmtMoney(t.accrued)}</div></div>
      <div class="kpi"><div class="k-lbl">Impôt exigible</div><div class="k-val ${t.due>0?'neg':''}" style="font-size:19px">${fmtMoney(t.due)}</div></div>
      <div class="kpi"><div class="k-lbl">Provision / jour</div><div class="k-val" style="font-size:19px">${fmtMoney(dailyTax)}</div></div>
    </div>`;

    // --- Règlement ---
    html+=`<div class="card mb"><div class="card-h"><div><div class="card-title">Régler mes impôts</div>
      <div class="card-sub">Trésorerie disponible : ${fmtMoney(G.cash)}</div></div></div>
      <div class="flex gap wrap">
        <button class="btn gold" onclick="Actions.payTax()" ${t.due<=0?'disabled style="opacity:.5"':''}>Payer l'impôt exigible${t.due>0?" ("+fmtMoney(t.due)+")":""}</button>
        <button class="btn" onclick="Actions.prepayTax()" ${t.accrued<=0?'disabled style="opacity:.5"':''}>Verser un acompte${t.accrued>0?" ("+fmtMoney(t.accrued)+")":""}</button>
      </div>
      <div class="flex gap wrap mt" style="align-items:center">
        <button class="btn sm ${t.auto?'mint':''}" onclick="Actions.toggleAutoTax()">${t.auto?"✅ Prélèvement automatique : ACTIVÉ":"Activer le prélèvement automatique"}</button>
        <div class="card-sub" style="margin:0">Règle l'impôt dès qu'il devient exigible (si la trésorerie le permet).</div>
      </div></div>`;

    // --- Fonctionnement ---
    html+=`<div class="card mb"><div class="card-h"><div class="card-title">Fonctionnement</div></div>
      <table class="tbl"><tbody>
        <tr><td>Assiette</td><td class="num">Bénéfice des entreprises</td></tr>
        <tr><td>Taux</td><td class="num">${fmtPct(rate*100,0)}</td></tr>
        <tr><td>Périodicité</td><td class="num">Exigible chaque mois (${DAYS_PER_MONTH} j)</td></tr>
        <tr><td>Délai de règlement</td><td class="num">${TAX_GRACE_DAYS} jours</td></tr>
        <tr><td>Sanction</td><td class="num neg">Production stoppée si impayé</td></tr>
        <tr><td>Total réglé à ce jour</td><td class="num">${fmtMoney(t.totalPaid)}</td></tr>
      </tbody></table></div>`;

    // --- Détail par entreprise (provision quotidienne) ---
    html+=`<div class="card"><div class="card-h"><div class="card-title">Provision d'impôt par entreprise (par jour)</div></div>
      <table class="tbl"><thead><tr><th>Entreprise</th><th class="num">Bénéfice/j</th><th class="num">Impôt/j</th></tr></thead>
      <tbody>${G.companies.map(c=>{const f=CompanySystem.dayFinance(c);const tx=Math.max(0,f.net)*rate;
        return `<tr><td>${defOf(c).icon} ${c.name}</td>
          <td class="num ${f.net>=0?'pos':'neg'}">${fmtMoney(f.net)}</td>
          <td class="num neg">${fmtMoney(tx)}</td></tr>`;}).join("")
        ||`<tr><td colspan="3"><div class="empty">Aucune entreprise.</div></td></tr>`}</tbody></table></div>`;

    return html;
  },

  /* Router d'action de notification : emmène le joueur là où il doit agir (§ ajout) */
  handleNotif(act){
    switch(act){
      case "found":      this.switchView("biz"); this.foundModal(); break;
      case "biz":        this.switchView("biz"); break;
      case "research":   this.switchView("world"); this.setWorldTab("recherche"); break;
      case "immo":       this.switchView("world"); this.setWorldTab("immo"); break;
      case "regions":    this.switchView("world"); this.setWorldTab("regions"); break;
      case "succes":     this.switchView("world"); this.setWorldTab("succes"); break;
      case "prets":      this.switchView("finance"); this.setFinanceTab("prets"); break;
      case "impots":     this.switchView("impots"); break;
      case "bourse":     this.switchView("bourse"); break;
      case "collection": this.switchView("collection"); break;
      default:           this.switchView("home");
    }
  },
