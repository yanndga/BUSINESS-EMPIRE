let secondAccumulator=0;
/* ============================================================
   MULTIPLAYER — duel en ligne 10 minutes (§ ajout)
   Matchmaking par code via Firebase Realtime Database. Les deux joueurs partent avec la
   même trésorerie ; après 10 minutes, la plus grosse trésorerie l'emporte.
   ============================================================ */
const MP = {
  db:null, offset:0, role:null, code:null, roomRef:null,
  active:false, ended:false, phase:"idle", spBackup:null,
  myCash:0, oppCash:0, startAt:0, endAt:0,
  cdTimer:null, syncTimer:null,

  configured(){ return !!(FIREBASE_CONFIG.databaseURL); },
  serverNow(){ return Date.now() + (this.offset||0); },
  genCode(){ const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; },

  // Chargement à la demande du SDK Firebase (nécessite une connexion internet).
  loadSDK(){
    return new Promise((resolve,reject)=>{
      if(window.firebase && window.firebase.database){ return resolve(); }
      const urls=[
        "https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js",
        "https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"
      ];
      let i=0;
      const next=()=>{
        if(i>=urls.length) return resolve();
        const s=document.createElement("script");
        s.src=urls[i++]; s.onload=next;
        s.onerror=()=>reject(new Error("Impossible de charger Firebase (connexion internet requise)."));
        document.head.appendChild(s);
      };
      next();
    });
  },
  async connect(){
    if(this.db) return;
    if(!this.configured()) throw new Error("no-config");
    await this.loadSDK();
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.database();
    this.db.ref(".info/serverTimeOffset").on("value", s=>{ this.offset = s.val()||0; });
  },

  // ---- Ouverture / interface ----
  open(){
    if(!this.configured()){
      UIManager.openModal(`<div class="modal-h"><h3>⚔️ Multijoueur</h3><button class="modal-close" onclick="UIManager.closeModal()">✕</button></div>
        <div class="modal-body">
          <p class="card-sub">Le duel en ligne a besoin d'une base <b>Firebase</b> (gratuite) pour relier les deux joueurs le plus vite possible.</p>
          <ol class="mp-help">
            <li>Créez un projet sur <b>console.firebase.google.com</b></li>
            <li>Activez <b>Realtime Database</b> (mode test)</li>
            <li>Ajoutez une app Web et copiez sa <b>config</b></li>
            <li>Collez-la dans <code>FIREBASE_CONFIG</code> en haut du fichier, puis rechargez</li>
          </ol>
          <p class="card-sub">Ensuite, ce bouton créera ou rejoindra une partie en un clic.</p>
        </div>`);
      return;
    }
    UIManager.openModal(`<div class="modal-h"><h3>⚔️ Duel — 10 minutes</h3><button class="modal-close" onclick="UIManager.closeModal()">✕</button></div>
      <div class="modal-body">
        <p class="card-sub">Bâtissez la plus grosse trésorerie en 10 minutes. Vous démarrez à <b>0 €</b> : contractez un prêt (onglet Finances) pour lancer votre empire !</p>
        <button class="btn gold full mt" onclick="MP.host()">➕ Créer une partie</button>
        <div class="mp-or">— ou rejoindre avec un code —</div>
        <div class="flex gap">
          <input id="mp-code-in" class="mp-input" maxlength="5" placeholder="CODE" oninput="this.value=this.value.toUpperCase()">
          <button class="btn" onclick="MP.join(document.getElementById('mp-code-in').value)">Rejoindre</button>
        </div>
      </div>`);
  },
  needConfig(e){
    this.hideOverlay();
    if(e && e.message==="no-config"){ this.open(); }
    else UIManager.toast((e&&e.message)||"Connexion multijoueur impossible.","red","⚠️");
  },

  async host(){
    UIManager.closeModal();
    try{ await this.connect(); }catch(e){ return this.needConfig(e); }
    const code=this.genCode();
    this.role="host"; this.code=code; this.ended=false;
    this.roomRef=this.db.ref("rooms/"+code);
    try{
      await this.roomRef.set({
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        durationMs: MP_MATCH_MS, startAt:null,
        host:{present:true, cash:MP_START_CASH, name:"Hôte"}, guest:null
      });
    }catch(e){ return this.needConfig(new Error("Écriture impossible — vérifiez les règles de la base (mode test).")); }
    this.roomRef.child("host").onDisconnect().update({present:false});
    this.watchRoom();
    this.showWaiting(code,false);
  },
  async join(code){
    code=(code||"").trim().toUpperCase();
    if(!code) return UIManager.toast("Entrez un code.","red","⚠️");
    UIManager.closeModal();
    try{ await this.connect(); }catch(e){ return this.needConfig(e); }
    this.roomRef=this.db.ref("rooms/"+code);
    let snap; try{ snap=await this.roomRef.get(); }catch(e){ return this.needConfig(e); }
    if(!snap.exists()) return UIManager.toast("Code invalide.","red","⚠️");
    const d=snap.val();
    if(d.guest && d.guest.present) return UIManager.toast("Cette partie est déjà pleine.","red","⚠️");
    if(d.startAt) return UIManager.toast("La partie a déjà commencé.","red","⚠️");
    this.role="guest"; this.code=code; this.ended=false;
    await this.roomRef.child("guest").set({present:true, cash:MP_START_CASH, name:"Invité"});
    this.roomRef.child("guest").onDisconnect().update({present:false});
    this.watchRoom();
    this.showWaiting(code,true);
  },

  watchRoom(){
    this.roomRef.on("value", snap=>{
      const d=snap.val();
      if(!d){ if(this.active) this.finish("opp-left"); return; }
      const opp = this.role==="host" ? d.guest : d.host;
      if(opp) this.oppCash = opp.cash||0;
      // Hôte : dès que l'invité est là, on programme le GO
      if(this.role==="host" && !d.startAt && d.guest && d.guest.present){
        this.roomRef.update({ startAt: this.serverNow()+MP_COUNTDOWN });
      }
      // Les deux : lancement du décompte quand startAt est défini
      if(d.startAt && this.phase==="waiting"){
        this.startAt=d.startAt;
        this.endAt=d.startAt + (d.durationMs||MP_MATCH_MS);
        this.beginCountdown();
      }
      // Adversaire déconnecté en cours de partie
      if(this.active && (!opp || opp.present===false)) this.finish("opp-left");
    });
  },

  beginCountdown(){
    if(this.phase==="countdown"||this.phase==="playing") return;
    this.phase="countdown";
    const el=document.getElementById("mp-overlay");
    el.className="mp-overlay open";
    el.innerHTML=`<div class="mp-card mp-count-card">
      <div class="mp-ring" id="mp-ring"></div>
      <div class="mp-count" id="mp-count"></div>
      <div class="mp-count-sub" id="mp-count-sub">Préparez-vous…</div></div>`;
    const numEl=document.getElementById("mp-count");
    const subEl=document.getElementById("mp-count-sub");
    let last=null, launched=false;
    const tick=()=>{
      const rem=this.startAt-this.serverNow();
      const label = rem>0 ? String(Math.min(3,Math.ceil(rem/1000))) : "GO";
      if(label!==last){
        last=label;
        if(label==="GO"){ numEl.textContent="GO !"; numEl.classList.add("go"); subEl.textContent="C'est parti !"; }
        else { numEl.textContent=label; }
        // relance l'animation une seule fois par changement (retrait/reflow/ajout de classe)
        numEl.classList.remove("pop"); void numEl.offsetWidth; numEl.classList.add("pop");
        const ring=document.getElementById("mp-ring");
        if(ring){ ring.classList.remove("pulse"); void ring.offsetWidth; ring.classList.add("pulse"); }
      }
      if(rem<=0 && !launched){
        launched=true;
        clearInterval(this.cdTimer);
        setTimeout(()=>{ this.hideOverlay(); this.startMatch(); }, 700);
      }
    };
    tick(); this.cdTimer=setInterval(tick,60);
  },

  startMatch(){
    if(this.active) return;
    // sauvegarde en mémoire de la partie solo, puis nouvelle partie équitable
    this.spBackup = JSON.parse(JSON.stringify(G));
    G = GameState.new(); G.cash = MP_START_CASH;
    MarketSystem.init(); EconomySystem.init(); AISystem.init();
    this.active=true; this.phase="playing"; this.ended=false;
    this.myCash=MP_START_CASH;
    document.body.classList.add("mp-playing");
    NotificationSystem.push("🏦","Duel lancé à 0 € — allez dans Finances pour emprunter et fonder votre première entreprise.","gold","finance");
    UIManager.switchView("home"); UIManager.refresh(true);
    UIManager.toast("Duel lancé ! Empruntez pour démarrer 🏦","gold","⚔️");
    this.renderHUD();
    this.syncTimer=setInterval(()=>this.syncCash(),1000);
  },
  syncCash(){
    if(!this.active) return;
    this.myCash=Math.round(G.cash);
    try{ this.roomRef.child(this.role).update({cash:this.myCash, present:true}); }catch(e){}
    this.renderHUD();
    if(this.serverNow()>=this.endAt) this.finish("time");
  },

  async finish(reason){
    if(this.ended) return; this.ended=true;
    clearInterval(this.syncTimer); clearInterval(this.cdTimer);
    this.active=false; this.phase="finished";
    this.myCash=Math.round(G.cash);
    let my=this.myCash, opp=this.oppCash;
    try{ if(this.roomRef) await this.roomRef.child(this.role).update({cash:my}); }catch(e){}
    if(reason==="time"){
      await new Promise(r=>setTimeout(r,900)); // laisser filer la dernière valeur adverse
      try{ const s=await this.roomRef.get(); const d=s.val()||{};
        const mn=this.role==="host"?d.host:d.guest, on=this.role==="host"?d.guest:d.host;
        if(mn&&typeof mn.cash==="number") my=mn.cash;
        if(on&&typeof on.cash==="number") opp=on.cash;
      }catch(e){}
    }
    const outcome=this.outcomeOf(my,opp,reason);
    this.showResult(outcome,my,opp);
    this.teardownNet();
  },
  outcomeOf(my,opp,reason){
    if(reason==="opp-left") return "win-left";
    if(my>opp) return "win";
    if(my<opp) return "lose";
    return "draw";
  },
  teardownNet(){
    try{
      if(this.roomRef){
        this.roomRef.off();
        this.roomRef.child(this.role).onDisconnect().cancel();
        if(this.role==="host") this.roomRef.remove();
      }
    }catch(e){}
  },
  async cancel(){
    clearInterval(this.cdTimer);
    try{
      if(this.roomRef){
        this.roomRef.off();
        if(this.role==="host") await this.roomRef.remove();
        else await this.roomRef.child("guest").remove();
      }
    }catch(e){}
    this.role=this.code=this.roomRef=null; this.phase="idle";
    this.hideOverlay();
    UIManager.toast("Recherche annulée.","blue","⚔️");
  },
  closeResult(){
    this.hideOverlay(); this.removeHUD();
    document.body.classList.remove("mp-playing");
    if(this.spBackup){ G=this.spBackup; this.spBackup=null; }
    this.role=this.code=this.roomRef=null; this.oppCash=0; this.phase="idle";
    UIManager.switchView("home"); UIManager.refresh(true); SaveSystem.save();
  },

  // ---- Rendu overlay / HUD ----
  showOverlay(html){ const el=document.getElementById("mp-overlay"); if(!el) return; el.className="mp-overlay open"; el.innerHTML=`<div class="mp-card">${html}</div>`; },
  hideOverlay(){ const el=document.getElementById("mp-overlay"); if(!el) return; el.className="mp-overlay"; el.innerHTML=""; },
  showWaiting(code,isGuest){
    this.phase="waiting";
    this.showOverlay(`
      <div class="mp-title">${isGuest?"Connexion…":"Partie créée"}</div>
      ${isGuest
        ? `<div class="mp-sub">En attente du lancement par l'hôte.</div>`
        : `<div class="mp-sub">Transmettez ce code à votre adversaire :</div><div class="mp-code">${code}</div>`}
      <div class="mp-spin">⏳ En attente de l'adversaire…</div>
      <button class="btn full mt" onclick="MP.cancel()">Annuler</button>`);
  },
  showResult(outcome,my,opp){
    const map={win:["🏆","Victoire !","var(--gold)"],lose:["😔","Défaite","var(--red)"],
      draw:["🤝","Égalité","var(--txt)"],"win-left":["🏆","Victoire (adversaire parti)","var(--gold)"]};
    const [ico,title,col]=map[outcome]||map.draw;
    this.showOverlay(`
      <div class="mp-big">${ico}</div>
      <div class="mp-title" style="color:${col}">${title}</div>
      <div class="mp-scores">
        <div><div class="l">Vous</div><div class="v" style="color:${my>=opp?'var(--gold)':'var(--txt)'}">${fmtMoney(my)}</div></div>
        <div class="vs">vs</div>
        <div><div class="l">Adversaire</div><div class="v" style="color:${opp>my?'var(--gold)':'var(--txt)'}">${fmtMoney(opp)}</div></div>
      </div>
      <button class="btn gold full mt" onclick="MP.closeResult()">Retour à ma partie</button>`);
  },
  renderHUD(){
    const el=document.getElementById("mp-hud"); if(!el) return;
    const rem=Math.max(0,this.endAt-this.serverNow());
    const mm=String(Math.floor(rem/60000)).padStart(2,"0");
    const ss=String(Math.floor((rem%60000)/1000)).padStart(2,"0");
    const iLead=this.myCash>this.oppCash, oLead=this.oppCash>this.myCash;
    el.classList.add("open");
    el.innerHTML=`
      <div class="mp-hud-side ${iLead?'lead':''}"><span class="l">Vous</span><span class="v">${fmtMoney(this.myCash)}</span></div>
      <div class="mp-hud-timer"><span class="t ${rem<60000?'low':''}">${mm}:${ss}</span><span class="lbl">restant</span></div>
      <div class="mp-hud-side ${oLead?'lead':''}"><span class="l">Adversaire</span><span class="v">${fmtMoney(this.oppCash)}</span></div>`;
  },
  removeHUD(){ const el=document.getElementById("mp-hud"); if(el){ el.classList.remove("open"); el.innerHTML=""; } }
};

function gameTick(){
  // 1) accumulation du revenu chaque seconde
  const ips=FinanceSystem.incomePerSec();
  G.cash += ips;
  if(ips>0) G.stats.totalEarned += ips;
  G.seconds++;

  // 1bis) accumulation de l'impôt : 20 % du bénéfice des entreprises (0 si production stoppée)
  TaxSystem.accrue(CompanySystem.totalPerSecond());

  // 2) réputation des entreprises dérive selon qualité/prix
  G.companies.forEach(c=>{
    const target = clamp(c.quality*0.6 + (1.2-c.priceMul)*20 + c.marketing*0.2, 0, 100);
    c.reputation += (target-c.reputation)*0.01;
    c.marketing = Math.max(0, c.marketing-0.05); // le marketing s'estompe
  });

  // 3) avancée d'un JOUR tous les SECONDS_PER_DAY
  secondAccumulator++;
  if(secondAccumulator>=SECONDS_PER_DAY){
    secondAccumulator=0;
    advanceDay();
  }

  // 4) mise à jour statistiques & interface
  const nw=FinanceSystem.netWorth();
  if(nw>G.stats.maxNW) G.stats.maxNW=nw;
  ProgressionSystem.checkLevel();
  ProgressionSystem.checkAchievements();

  // faillite : trésorerie très négative durablement
  if(G.cash < -Math.max(50000, FinanceSystem.assets()*0.3)){
    handleBankruptcy();
  }

  UIManager.refresh();
}

function advanceDay(){
  G.day++; G.stats.daysPlayed++;
  if(G.day%DAYS_PER_MONTH===0){ G.month++; FinanceSystem.monthlyPayment();
    if(G.month%12===0) G.year++; }
  EconomySystem.tickDay();
  MarketSystem.tickDay();
  AISystem.tickDay();
  ResearchSystem.tickDay();
  PropertySystem.tickDay();
  CollectionSystem.tickDay();
  EventSystem.tickDay();
  TaxSystem.tickDay();
  StockSystem.tickDay();
  // historique de la valeur d'empire (pour le graphique)
  G.nwHistory.push(Math.round(FinanceSystem.netWorth()));
  if(G.nwHistory.length>60) G.nwHistory.shift();
}

function handleBankruptcy(){
  // on liquide une entreprise pour éviter la spirale (mécanique de risque §12)
  if(G.companies.length>0){
    const c=G.companies.reduce((a,b)=>CompanySystem.value(a)<CompanySystem.value(b)?a:b);
    G.cash += CompanySystem.value(c)*0.5;
    G.companies=G.companies.filter(x=>x.uid!==c.uid);
    NotificationSystem.push("⚠️","Difficultés financières : "+c.name+" a été liquidée.","red");
    UIManager.toast("Liquidation forcée de "+c.name+".","red","⚠️");
  } else if(G.properties.length>0){
    const p=G.properties[0]; G.cash+=p.value*0.5; G.properties.shift();
    NotificationSystem.push("⚠️","Un bien immobilier a été bradé pour éviter la faillite.","red");
  } else {
    G.cash=Math.max(G.cash,0); // filet de sécurité minimal
  }
}

/* ============================================================
   INITIALISATION
   ============================================================ */
function initGame(){
  const loaded=SaveSystem.load();
  if(!loaded){
    G=GameState.new();
    MarketSystem.init();
    NotificationSystem.push("👋","Bienvenue ! Touchez cette notification pour fonder votre première entreprise.","gold","found");
  }
  EconomySystem.init();
  MarketSystem.init();
  AISystem.init();

  // progression hors ligne (§24)
  if(loaded) SaveSystem.offline();

  UIManager.init();

  // boucle temps réel
  setInterval(gameTick, TICK_MS);
  // sauvegarde automatique (§23)
  setInterval(()=>SaveSystem.save(), 5000);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) SaveSystem.save(); });
  window.addEventListener("beforeunload",()=>SaveSystem.save());
}

/* Exposition globale : les gestionnaires onclick="..." écrits dans le HTML s'exécutent
   dans la portée de window, où les déclarations `const` de premier niveau ne sont PAS
   visibles. On les rattache donc explicitement à window pour que les boutons fonctionnent. */
Object.assign(window, {
  GameState, EconomySystem, CompanySystem, EmployeeSystem, MarketSystem, AISystem, StockSystem,
  ResearchSystem, PropertySystem, CollectionSystem, FinanceSystem, TaxSystem, EventSystem, NotificationSystem,
  ProgressionSystem, SaveSystem, UIManager, Actions, MP, refreshModalFound
});

// bouton sauvegarde accessible : clic long / raccourci
document.addEventListener("keydown",e=>{ if(e.key==="s"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); UIManager.saveModal(); }});

// Ajout d'un accès "Sauvegarde" dans la barre latérale au chargement
window.addEventListener("load",()=>{
  const foot=document.querySelector(".sidebar-foot");
  if(foot){ foot.innerHTML=`<button class="btn sm full" onclick="UIManager.saveModal()">💾 Sauvegarde & options</button>
    <div style="margin-top:8px">Sauvegarde automatique active.</div>`; }
  initGame();
});
</script>
